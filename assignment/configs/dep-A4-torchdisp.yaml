# DeepEP arm A4: dispatcher=torch.
# Replaces the DeepEP all-to-all with a plain NCCL all-gather of every token to
# every rank. Moves far more bytes, but has no CPU-side metadata handshake.
defaults: sft-nanov3-cascade2chat-8k-best-1n8g.yaml
policy:
  dtensor_cfg:
    automodel_kwargs:
      backend:
        _target_: nemo_automodel.components.models.common.utils.BackendConfig
        attn: te
        linear: te
        rms_norm: torch_fp32
        experts: torch_mm
        dispatcher: torch
        dispatcher_num_sms: 20
        dispatcher_async_dispatch: false
        enable_hf_state_dict_adapter: true
        rope_fusion: false
