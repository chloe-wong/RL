# Megatron evenpack + FP8 (blockwise e4m3) GEMMs. MFU is still reported against the BF16 peak.
defaults: sft-nanov3-cascade2chat-8k-meg-evenpack-1n8g.yaml
policy:
  megatron_cfg:
    moe_router_dtype: fp32
    fp8_cfg:
      enabled: true
      fp8: e4m3
      fp8_recipe: blockwise
      fp8_param: false
    env_vars:
      NVTE_FP8_BLOCK_SCALING_FP32_SCALES: "1"
