# DeepEP arm A3: dispatcher_num_sms=32 (up from the default 20).
# The opposite direction: more SMs on the all-to-all in case it is the limiter.
defaults: sft-nanov3-cascade2chat-8k-best-1n8g.yaml
policy:
  dtensor_cfg:
    automodel_kwargs:
      backend:
        _target_: nemo_automodel.components.models.common.utils.BackendConfig
        attn: te
        linear: te
        rms_norm: torch_fp32
        experts: torch_mm
        dispatcher: deepep
        dispatcher_num_sms: 32
        dispatcher_async_dispatch: false
        enable_hf_state_dict_adapter: true
        rope_fusion: false
