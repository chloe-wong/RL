# Megatron evenpack + HybridEP flex dispatcher.
defaults: sft-nanov3-cascade2chat-8k-meg-evenpack-1n8g.yaml
policy:
  megatron_cfg:
    moe_router_dtype: fp32
    moe_token_dispatcher_type: flex
